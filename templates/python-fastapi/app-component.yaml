# DigitalOcean App Platform `services:` entry for a FastAPI backend.
# Paste under `services:` in .do/app.yaml (the kit's templates/do-app.yaml
# shows the full spec). Dockerfile build shown; for the Python buildpack
# delete dockerfile_path and uncomment run_command.
  - name: api
    github:
      repo: OWNER/REPO            # CHANGE
      branch: main
      deploy_on_push: true
    source_dir: backend           # CHANGE: folder that holds the Dockerfile
    dockerfile_path: backend/Dockerfile
    # run_command: uvicorn src.main:app --host 0.0.0.0 --port $PORT   # CHANGE: app module
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 15
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}   # bindable: the managed database named `db`
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      # Secrets: declare the key with an empty value, set it in the control panel. CHANGE or delete.
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
