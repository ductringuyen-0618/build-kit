# GitHub Actions job for a Next.js app. Paste under `jobs:` in
# .github/workflows/ci.yml (keep the two-space indent). Lines marked
# CHANGE are the ones a new repo must edit.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend   # CHANGE: folder that holds package.json
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # CHANGE: match the Dockerfile base image
          cache: npm           # CHANGE: pnpm (and run `corepack enable` first) for pnpm
          cache-dependency-path: frontend/package-lock.json   # CHANGE: same folder as working-directory
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
