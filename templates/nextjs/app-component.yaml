# DigitalOcean App Platform `services:` entry for a Next.js app.
# Paste under `services:` in .do/app.yaml (the kit's templates/do-app.yaml
# shows the full spec). Buildpack build shown (package.json + lockfile are
# auto-detected); for the standalone Dockerfile add
# `dockerfile_path: frontend/Dockerfile` and delete build_command / run_command.
  - name: web
    github:
      repo: OWNER/REPO            # CHANGE
      branch: main
      deploy_on_push: true
    source_dir: frontend          # CHANGE: folder that holds package.json
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    envs:
      - key: NEXT_PUBLIC_API_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}         # same-origin; the ingress forwards /api to a separate backend if any
      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"
      # CHANGE: add DATABASE_URL (value ${db.DATABASE_URL}, scope RUN_TIME) if Next.js owns the data
