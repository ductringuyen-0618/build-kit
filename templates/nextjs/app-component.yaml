# App Platform service component for a Next.js app in frontend/.
# Paste under `services:` in .do/app.yaml. Buildpack variant; for the
# standalone Dockerfile add dockerfile_path and drop build/run commands.
  - name: web
    github:
      repo: OWNER/REPO
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    envs:
      - key: NEXT_PUBLIC_API_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"
