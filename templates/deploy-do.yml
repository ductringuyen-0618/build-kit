# Deploy workflow: runs only on the default branch, only after the CI
# workflow finished green. Copy to .github/workflows/deploy.yml and edit
# every line marked "# CHANGE:". Two variants are included; keep one and
# delete the other:
#   A. app-platform  - deploy to DigitalOcean App Platform from .do/app.yaml
#   B. ghcr-image    - build a Docker image and push it to GHCR for any host to pull
#
# Secrets: a human creates DIGITALOCEAN_ACCESS_TOKEN in the repository
# (Settings > Secrets and variables > Actions, or `gh secret set
# DIGITALOCEAN_ACCESS_TOKEN`, which prompts for the value). The agent never
# reads, prints or pastes the token value. Variant B needs no extra secret.

name: Deploy

on:
  workflow_run:
    workflows: [CI]           # CHANGE: must equal the `name:` of the CI workflow exactly
    branches: [main]          # CHANGE: default branch if not main
    types: [completed]
  workflow_dispatch:          # manual run from the Actions tab, for re-deploys

# Never cancel a deploy half-way; queue a second one behind it instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Variant A: DigitalOcean App Platform via the official action.
  # Reads .do/app.yaml (templates/do-app.yaml is a starting point), creates
  # the app on the first run and updates it on every run after that.
  # ---------------------------------------------------------------------
  app-platform:
    name: Deploy to App Platform
    # Skip when CI failed or was cancelled; always allow a manual run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          # app_spec_location: .do/app.yaml   # CHANGE: only if the spec lives elsewhere
          print_build_logs: true
          print_deploy_logs: true
        # env:                                # CHANGE: repository secrets the spec references as ${NAME}
        #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Print live URL
        run: echo '${{ steps.deploy.outputs.app }}' | jq -r '.live_url // .default_ingress // empty'

  # ---------------------------------------------------------------------
  # Variant B: build the service image and push it to GitHub Container
  # Registry. Any host that pulls images (App Platform `image:` block, a VM,
  # Fly, Render, Kubernetes) can then run ghcr.io/OWNER/REPO/IMAGE:TAG.
  # GITHUB_TOKEN is enough; `packages: write` is the only extra permission.
  # ---------------------------------------------------------------------
  ghcr-image:
    name: Push image to GHCR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend                  # CHANGE: folder containing the Dockerfile ('.' for a single-component repo)
          file: backend/Dockerfile          # CHANGE: Dockerfile path from the repo root
          push: true
          # CHANGE: image name after the repository; ghcr.io names must be lower-case
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
