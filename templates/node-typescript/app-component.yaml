# App Platform service component for a Node/TypeScript backend in backend/.
# Paste under `services:` in .do/app.yaml. Buildpack variant shown; for a
# Dockerfile add dockerfile_path and drop build_command/run_command.
  - name: api
    github:
      repo: OWNER/REPO
      branch: main
      deploy_on_push: true
    source_dir: backend
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 10
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
