# App Platform service component for a Go backend in backend/.
# Paste under `services:` in .do/app.yaml. Dockerfile variant shown; the Go
# buildpack detects go.mod but the run command must then be set explicitly.
  - name: api
    github:
      repo: OWNER/REPO
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
